apply plugin: 'com.android.application'

android {
    namespace 'com.whalepet'
    compileSdk 36

    defaultConfig {
        applicationId "com.whalepet"
        minSdk 24
        targetSdk 36
        versionCode 21
        versionName "0.9.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.whalepet'
    compileSdk 36

    defaultConfig {
        applicationId "com.whalepet"
        minSdk 24
        targetSdk 36
        // versionCode 与 versionName 必须成对改。
        // 上次的坑：只替换了 versionCode，versionName 的字符串没匹配上，
        // 结果连发 6 个版本，APK 里显示的还都是 0.9.0。
        versionCode 48
        versionName "0.12.17"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}


